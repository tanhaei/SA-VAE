seed: 20260724
data:
  source: synthetic
  synthetic:
    n_patients: 80
    visits_per_patient: 2
    natural_missing_rate: 0.04
  split:
    train: 0.7
    validation: 0.15
    test: 0.15
columns:
  patient_id: patient_id
  note_text: note_text
  continuous:
  - age
  - iop
  - visual_acuity
  - followup_days
  categorical:
  - sex
  - diabetes
  - diagnosis
  - medication
  - surgery
  - followup_status
  targets:
  - iop
  - visual_acuity
  - diagnosis
  - followup_status
text:
  backend: hash
  dimension: 12
model:
  hidden_dimension: 24
  latent_dimension: 6
  beta: 0.01
  learning_rate: 0.01
  batch_size: 32
  max_epochs: 18
  patience: 4
  denoising_rate: 0.2
  gradient_clip: 5.0
neighbors:
  k: 5
  temperature: 0.3
baselines:
  knn_k: 5
  random_forest:
    n_estimators: 35
    max_depth: 8
  gradient_boosting:
    n_estimators: 35
    max_depth: 5
ablation:
  structured_only: true
evaluation:
  mechanisms:
  - mcar
  - mar
  - mnar
  mask_rate: 0.2
  masking_strength: 1.25
  repeats: 2
  mar_drivers:
  - age
  - diabetes
  baselines:
  - mean_mode
  - knn
  - random_forest
  - gradient_boosting
  skip_unavailable_baselines: false
  explain_limit: 2
output:
  directory: results/smoke
visualization:
  color_by: diagnosis
